<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цифровой механик</title>
<style>body{font:16px system-ui;max-width:48rem;margin:auto;padding:1rem;color:#182e32}button,select,input{font:inherit;padding:.5rem;margin:.25rem}article,fieldset{margin:1rem 0;padding:1rem;border:1px solid #bcc}pre{white-space:pre-wrap}input{max-width:80%}</style>
<h1>Цифровой механик</h1><label>ТС <select id="vehicle"></select></label><label>Проверка <select id="sid"></select></label>
<button id="diagnose">Получить результат диагностики</button><main id="chat"></main>
<form id="ask"><input id="question" required placeholder="Вопрос механику" aria-label="Вопрос"><button>Отправить</button></form>
<script>
const $=id=>document.getElementById(id), v=$('vehicle'), s=$('sid'), chat=$('chat');
const key=()=>JSON.stringify([v.value,s.value]);
let epoch=0;
function clear(){epoch++;chat.replaceChildren()}
function node(parent,tag,text){const el=document.createElement(tag);el.textContent=text;parent.append(el);return el}
async function post(path,data){const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const body=await res.json();if(!res.ok)throw Error(body.error);return body}
async function send(q){
 const generation=epoch, ids={vehicle_id:v.value,session_id:s.value};
 const card=node(chat,'article','');node(card,'b',q);const status=node(card,'p','Обработка…');
 try{const r=await post('/api/chat',{...ids,question:q});if(generation!==epoch)return;
 status.textContent=r.verdict;const m=r.ml_observations;
 node(card,'p','Качество записи: '+m.signal_quality+' · Уверенность: '+(m.confidence??'—')+' · Оценка: '+(m.anomaly_score??'—'));
 node(card,'p',[m.engine_model,m.anomaly_type,m.description,m.model_version].filter(Boolean).join(' · '));
 for(const [k,label] of [['possible_causes','Возможные причины'],['risk','Риск'],['checks','Проверки']]){
 for(const item of r[k]){const p=node(card,'p',label+': '+item.text+' ');const ref=r.references.find(x=>x.fragment_id===item.fragment_id);if(ref){const a=node(p,'a',ref.manual+', стр. '+ref.pdf_page);a.href=ref.url;a.target='_blank'}}}
 if(r.clarifying_question)node(card,'p',r.clarifying_question);
 if(r.ticket_draft){const form=node(card,'fieldset','');node(form,'legend','Проект заявки');
 const d=r.ticket_draft;node(form,'p',[d.vehicle_id,d.session_id,d.anomaly_type,d.urgency].join(' · '));node(form,'p',d.conclusion);
 for(const op of d.operations)node(form,'p',op);
 node(form,'p','Запчасти: '+(d.spare_parts.join(', ')||'не указаны'));
 const b=node(form,'button','Подтвердить отправку');b.onclick=async()=>{b.disabled=true;try{const ticket=await post('/api/confirm',{...ids,draft_id:r.draft_id});b.textContent=ticket.ticket_id}catch(e){b.textContent=e.message}}}
 }catch(e){status.textContent=e.message}}
fetch('/api/fleet').then(r=>r.json()).then(f=>{for(const id of Object.keys(f))v.add(new Option(id,id));v.onchange=()=>{clear();s.replaceChildren();for(const id of f[v.value])s.add(new Option(id,id))};v.onchange();s.onchange=clear});
$('diagnose').onclick=()=>send('Покажи результат диагностики');$('ask').onsubmit=e=>{e.preventDefault();send($('question').value);$('question').value=''};
</script></html>
